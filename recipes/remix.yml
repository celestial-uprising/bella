name: bella
description: Celestial Uprising's Immutable Operating System
base-image: quay.io/fedora/fedora-bootc
image-version: 44
stages:
  - name: driver-builder
    from: quay.io/fedora/fedora-bootc:44
    modules:
      - type: containerfile
        snippets:
          - RUN dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
          - RUN dnf install -y https://zfsonlinux.org/fedora/zfs-release-3-1.fc44.noarch.rpm
          - RUN sed -i -E '/^\[rpmfusion-free(-updates)?\]/a excludepkgs=ffmpeg*,libav*' /etc/yum.repos.d/rpmfusion-free*.repo
          - RUN sed -i -E '/^\[rpmfusion-nonfree(-updates)?\]/a excludepkgs=ffmpeg*,libav*' /etc/yum.repos.d/rpmfusion-nonfree*.repo
          - RUN export KVER=$(cd /usr/lib/modules && echo *) && dnf install -y zfs-dkms
          - RUN export KVER=$(cd /usr/lib/modules && echo *) && dkms autoinstall -k $KVER && dnf clean all
  - name: builder
    from: quay.io/fedora/fedora:44
    modules:
      - type: copy
        src: files/scripts/stage/*
        dest: /tmp/
      - type: script
        snippets:
          - mkdir -p /tmp/bin
          - dnf5 upgrade -y
          - |
            bash /tmp/stage.sh
            bash /tmp/pi-bolt.sh
modules:
  - type: os-release
    properties:
      NAME: "Bella"
      PRETTY_NAME: "Bella c01 by Celestial Uprising"
      VERSION_CODENAME: "zen"
      ID_LIKE: fedora
      HOME_URL: "https://github.com/celestial-uprising/bella/"
      BUG_REPORT_URL: "https://github.com/celestial-uprising/bella/"
      VARIANT: "bella"
      RELEASE_TYPE: "alpha"
  - type: kargs
    kargs:
      - amd_iommu=on
      - iommu=pt
      - kvm_amd.nested=1
      - split_lock_detect=off
      - transparent_hugepage=always
      - kvm.ignore_msrs=1
      - net.ifnames=0
      - amdgpu.ppfeaturemask=0xffffffff
      - amdgpu.sg_display=0
      - pcie_aspm=off
  - type: containerfile
    snippets:
      - RUN dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
      - RUN dnf install -y https://zfsonlinux.org/fedora/zfs-release-3-1.fc44.noarch.rpm
      - RUN sed -i -E '/^\[rpmfusion-free(-updates)?\]/a excludepkgs=ffmpeg*,libav*' /etc/yum.repos.d/rpmfusion-free*.repo
      - RUN sed -i -E '/^\[rpmfusion-nonfree(-updates)?\]/a excludepkgs=ffmpeg*,libav*' /etc/yum.repos.d/rpmfusion-nonfree*.repo
  - type: dnf
    repos:
      copr:
        - scottames/voxtype
        - archjun/mgba
