  - type: files
    files:
      - source: etc/
        destination: /etc/
      - source: usr/
        destination: /usr/
      - source: aoccv6/
        destination: /tmp/
  - type: containerfile
    snippets:
      - COPY --from=driver-builder /usr/lib/modules/ /usr/lib/modules/
      - COPY --from=driver-builder /var/lib/dkms/ /var/lib/dkms/
      - RUN echo "blacklist nouveau" > /etc/modprobe.d/blacklist-nouveau.conf
      - RUN systemctl enable zfs.target zfs-import-scan.service zfs-mount.service
  - type: copy
    from: builder
    src: /tmp/bin/
    dest: /usr/bin/
  - type: copy
    from: builder
    src: /tmp/skel/
    dest: /etc/skel/
  - type: fonts
    fonts:
      nerd-fonts:
        - VictorMono
        - JetBrainsMono
  - type: systemd
    system:
      enabled:
        - virtqemud.socket
        - virtnetworkd.socket
        - virtnodedevd.socket
        - virtsecretd.socket
        - virtstoraged.socket
        - virtqemud.service
        - sddm.service
        - tailscaled.service
        - firewalld.service
    user:
      enabled:
        - podman.socket
  - type: containerfile
    snippets:
      - RUN dnf remove -y rpmfusion-free-release rpmfusion-nonfree-release && rm -f /etc/yum.repos.d/rpmfusion*.repo && dnf clean all
  - type: script
    scripts:
      - aoccv6.sh
      - twilight.sh
      - annoy.sh
      - regenerateinitramfs.sh
