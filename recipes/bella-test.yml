name: lamuella
description: Celestial Uprising's Immutable Operating System
base-image: quay.io/fedora/fedora-bootc
image-version: 44
stages:
  - name: driver-builder
    from: quay.io/fedora/fedora-bootc:44
    modules:
      - type: containerfile
        snippets:
          - RUN dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
          - RUN dnf install -y https://zfsonlinux.org/fedora/zfs-release-3-1.fc44.noarch.rpm
          - RUN export KVER=$(cd /usr/lib/modules && echo *) && dnf install -y zfs-dkms
          - RUN export KVER=$(cd /usr/lib/modules && echo *) && dkms autoinstall -k $KVER && dnf clean all
  - name: aocc-rpm-builder
    from: quay.io/fedora/fedora:44
    modules:
      - type: script
        snippets:
          - dnf5 upgrade -y
          - dnf5 install -y rpm-build rpmdevtools dnf5-plugins createrepo_c zstd tar curl xz gcc libquadmath ncurses
          - mkdir -p /opt/aocc /var/tmp/srpms /var/tmp/aocc-rpms
      - type: files
        files:
          - source: aoccv6/
            destination: /tmp/
      - type: script
        scripts:
          - aoccv6.sh    
      - type: script
        snippets:
          - |
            export PATH="/opt/AMD/aocc-compiler-6.0.0/bin:${PATH}"
            export CC=clang
            export CXX=clang++
            export LD=ld.lld
            cat << 'EOF' > /etc/rpm/macros.znver3-aocc
            %_arch_optflags -O3 -march=znver3 -mtune=znver3 -flto=thin -pipe -fuse-ld=lld
            %optflags %{_arch_optflags} -Wall -Werror=format-security -Wp,-D_FORTIFY_SOURCE=3 -fexceptions -fstack-protector-strong
            %__cc clang
            %__cxx clang++
            %__ld ld.lld
            EOF
          - |
            # Rebuild high-impact RPMs & deps with AOCC (-march=znver3 -O3 -flto=thin)
            # Keep per-package fallback so one strict LLVM warning doesn't abort the stage
            AOCC_PKGS="mesa-vulkan-drivers pipewire wireplumber zstd lz4 mpv ffmpeg waybar rofi-wayland kitty"
            for pkg in ${AOCC_PKGS}; do
              echo "=== AOCC znver3 build: ${pkg} ==="
              if dnf5 download --source --destdir /var/tmp/srpms "${pkg}" && \
                 dnf5 builddep -y "/var/tmp/srpms/${pkg}"*.src.rpm && \
                 rpmbuild --rebuild \
                   --define "_rpmdir /var/tmp/aocc-rpms" \
                   "/var/tmp/srpms/${pkg}"*.src.rpm; then
                echo "OK: ${pkg}"
              else
                echo "WARN: ${pkg} failed under AOCC; skipping custom RPM"
                rm -f "/var/tmp/srpms/${pkg}"*.src.rpm
              fi
            done
          - createrepo_c /var/tmp/aocc-rpms
  - name: builder
    from: quay.io/fedora/fedora:44
    modules:
      - type: copy
        src: files/scripts/stage/*
        dest: /tmp/
      - type: script
        snippets:
          - mkdir -p /tmp/bin
          - dnf5 upgrade -y
          - |
            bash /tmp/stage.sh
            bash /tmp/pi-bolt.sh
modules:
  - type: os-release
    properties:
      NAME: "Lamuella"
      PRETTY_NAME: "Lamuella c01 by Celestial Uprising"
      VERSION_CODENAME: "zen"
      ID_LIKE: fedora
      HOME_URL: "https://github.com/celestial-uprising/lamuella/"
      BUG_REPORT_URL: "https://github.com/celestial-uprising/lamuella/"
      VARIANT: "lamuella"
      RELEASE_TYPE: "alpha"
  - type: kargs
    kargs:
      - pcie_aspm=off
      - amd_iommu=on
      - iommu=pt
      - kvm_amd.nested=1
      - split_lock_detect=off
      - transparent_hugepage=always
      - kvm.ignore_msrs=1
      - net.ifnames=0
  - type: copy
    from: aocc-rpm-builder
    src: /var/tmp/aocc-rpms/
    dest: /var/tmp/local-aocc-repo/
  - type: containerfile
    snippets:
      - RUN dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
      - RUN dnf install -y https://zfsonlinux.org/fedora/zfs-release-3-1.fc44.noarch.rpm
      - RUN printf '[oglaroon-znver3-aocc]\nname=Lamuella AOCC znver3 RPMs\nbaseurl=file:///var/tmp/local-aocc-repo\nenabled=1\ngpgcheck=0\npriority=1\n' > /etc/yum.repos.d/oglaroon-znver3-aocc.repo
